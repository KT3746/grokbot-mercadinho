<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0e0a08" />
    <meta
      name="description"
      content="MERCADINHO — atenda clientes numa lojinha original antes da paciência acabar."
    />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>MERCADINHO</title>
    <link rel="icon" href="./favicon.svg?v=__BUILD_ID__" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <canvas id="scene" aria-label="Área do jogo: clientes e prateleiras"></canvas>
      <div id="hud" hidden>
        <div class="hud-brand">
          <div class="hud-shop" id="hud-shop">MERCADINHO</div>
        </div>
        <div class="hud-row">
          <div class="hud-cluster left">
            <div class="hud-score-line">
              <div>
                <div class="hud-label">Pontos</div>
                <div id="hud-score">0</div>
              </div>
              <div class="hud-turno-box">
                <div id="hud-turno">Turno 1</div>
                <div id="hud-lives" aria-label="Vidas">❤❤❤❤</div>
              </div>
            </div>
            <div id="hud-combo" class="combo-meter" hidden>
              <div class="combo-flame" aria-hidden="true">🔥</div>
              <div class="combo-stack">
                <div class="combo-label">COMBO</div>
                <div class="combo-value" id="hud-combo-val">×2</div>
              </div>
              <div class="combo-bar" aria-hidden="true"><div id="hud-combo-fill"></div></div>
            </div>
            <div id="hud-goals" class="hud-goals" hidden></div>
          </div>
          <div class="hud-cluster right">
            <button type="button" class="icon-btn" id="btn-speed" tabindex="-1" aria-label="Velocidade">1x</button>
            <button type="button" class="icon-btn" id="btn-pause" tabindex="-1" aria-label="Pausar">Pausa</button>
          </div>
          <div class="hud-hand" id="hud-hand" hidden>
            <div class="hud-label">Na mão</div>
            <div id="hud-hand-name">—</div>
            <button type="button" class="icon-btn" id="btn-drop" tabindex="-1" aria-label="Soltar item">Soltar</button>
          </div>
        </div>
      </div>
      <div id="tutor-spot" hidden aria-hidden="true"></div>
      <div id="hurt" hidden aria-hidden="true"></div>
      <div id="toasts" class="toast-stack" hidden aria-live="polite"></div>
      <div id="banner" hidden></div>
      <div id="ui"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
